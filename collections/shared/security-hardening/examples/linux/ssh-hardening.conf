# SSH Hardening Configuration
# Place in: /etc/ssh/sshd_config.d/00-hardening.conf
#   (00- so it sorts before 50-cloud-init.conf: sshd keeps the FIRST value it
#   reads, so a later cloud-init "PasswordAuthentication yes" would not win.
#   The main sshd_config must contain "Include /etc/ssh/sshd_config.d/*.conf"
#   near its top.)
#
# BEFORE applying (remote hosts): confirm key login works in a SECOND session
#   ssh -o PreferredAuthentications=publickey -o PasswordAuthentication=no user@host
# and keep your current session open until the new config is verified.
#
# Test with:   sshd -t
# Apply with:  systemctl reload ssh    (Debian/Ubuntu)
#              systemctl reload sshd   (RHEL/Fedora/Arch/SUSE)
# Verify:      sshd -T | grep -E '^(passwordauthentication|permitrootlogin) '

# Authentication
# ==============

# Disable root login
PermitRootLogin no

# Disable password authentication (use keys only)
PasswordAuthentication no
PermitEmptyPasswords no

# Disable challenge-response authentication
ChallengeResponseAuthentication no

# Disable Kerberos and GSSAPI
KerberosAuthentication no
GSSAPIAuthentication no

# Enable public key authentication
PubkeyAuthentication yes

# Limit authentication attempts
MaxAuthTries 3
# Multiplexed sessions per connection; too low breaks ControlMaster and IDE remotes
MaxSessions 4

# Set login grace time (time to complete authentication)
LoginGraceTime 30

# Protocol and Encryption
# =======================

# Specify strong key exchange algorithms
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Specify strong ciphers
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# Specify strong MACs
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256

# Access Control
# ==============

# Limit users and groups (uncomment and customize)
# AllowUsers deploy admin
# AllowGroups ssh-users

# Deny specific users
# DenyUsers root guest

# Session Security
# ================

# Disable X11 forwarding
X11Forwarding no

# Disable TCP forwarding (breaks SSH tunnels / IDE remotes; drop if you rely on them)
AllowTcpForwarding no

# Disable agent forwarding
AllowAgentForwarding no

# Set idle timeout (5 minutes)
ClientAliveInterval 300
ClientAliveCountMax 2

# Limit concurrent unauthenticated connections
MaxStartups 10:30:60

# Banner and Logging
# ==================

# Display legal banner (customize path)
Banner /etc/issue.net

# Logging level
LogLevel VERBOSE

# Disable host-based authentication
HostbasedAuthentication no
IgnoreRhosts yes
