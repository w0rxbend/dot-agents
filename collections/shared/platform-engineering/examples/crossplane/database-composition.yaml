# Crossplane Composition Example (Pipeline mode)
# Production PostgreSQL on AWS RDS behind a platform API (XPostgreSQLDatabase).
#
# Requires Crossplane v1.14+ and function-patch-and-transform installed:
#   apiVersion: pkg.crossplane.io/v1beta1
#   kind: Function
#   metadata: { name: function-patch-and-transform }
#   spec: { package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:<pinned-version> }
# Legacy `spec.resources` + `patches` (Resources mode) is deprecated and removed in Crossplane v2.
#
# Environments: write one Composition per environment (for example an in-cluster
# variant labelled environment: dev) and select it from the claim/XR with
# compositionSelector.matchLabels, instead of switching resources inside one Composition.
#
# Credentials: never build a connection string with a literal user:password.
# RDS generates the master password into a Secret (autoGeneratePassword), and the
# managed resource publishes host/port/username/password as connection details.
# On Crossplane v1 they are forwarded to the claim's connection secret below; on v2,
# where XR connection secrets were removed, have consumers read the managed
# resource's secret (writeConnectionSecretToRef) or compose a Secret explicitly.

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-database-aws
  labels:
    crossplane.io/xrd: xpostgresqldatabases.platform.example.com
    provider: aws
    environment: prod
spec:
  compositeTypeRef:
    apiVersion: platform.example.com/v1alpha1
    kind: XPostgreSQLDatabase
  writeConnectionSecretsToNamespace: crossplane-system
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: rds-instance
            base:
              apiVersion: rds.aws.upbound.io/v1beta1
              kind: Instance
              spec:
                forProvider:
                  region: us-east-1
                  engine: postgres
                  engineVersion: "16"
                  instanceClass: db.t3.micro
                  allocatedStorage: 20
                  username: app_admin
                  autoGeneratePassword: true
                  passwordSecretRef:
                    namespace: crossplane-system
                    key: password
                  skipFinalSnapshot: false
                  publiclyAccessible: false
                  storageEncrypted: true
                  backupRetentionPeriod: 7
                writeConnectionSecretToRef:
                  namespace: crossplane-system
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.size
                toFieldPath: spec.forProvider.instanceClass
                transforms:
                  - type: map
                    map:
                      small: db.t3.micro
                      medium: db.t3.small
                      large: db.t3.medium
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.storage
                toFieldPath: spec.forProvider.allocatedStorage
              # Unique secret names per XR
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rds-master-password"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rds-connection"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.address
                toFieldPath: status.endpoint
            connectionDetails:
              - name: host
                type: FromConnectionSecretKey
                fromConnectionSecretKey: endpoint
              - name: port
                type: FromConnectionSecretKey
                fromConnectionSecretKey: port
              - name: username
                type: FromConnectionSecretKey
                fromConnectionSecretKey: username
              - name: password
                type: FromConnectionSecretKey
                fromConnectionSecretKey: password
