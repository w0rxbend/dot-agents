# KEDA RabbitMQ Scaler Example
# Scale to zero when queue is empty

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rabbitmq-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: message-processor
  minReplicaCount: 0   # Scale to zero when queue empty
  maxReplicaCount: 30
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: tasks
      mode: QueueLength   # replaces the deprecated queueLength field
      value: "10"         # Scale up when >10 messages per replica
    authenticationRef:
      name: rabbitmq-auth
---
# Connection string comes from a Secret, never inline in the ScaledObject.
# kubectl create secret generic rabbitmq-conn -n production \
#   --from-literal=host='amqp://<user>:<password>@rabbitmq.default.svc.cluster.local:5672/'
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
  namespace: production
spec:
  secretTargetRef:
  - parameter: host
    name: rabbitmq-conn
    key: host
